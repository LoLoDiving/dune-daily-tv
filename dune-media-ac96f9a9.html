<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>DUNE Malta — Your dive memories</title>
  <style>
    :root{--navy:#12243c;--orange:#f47600;--bg:#eef2f6;--card:#fff;--text:#12243c;--muted:#6d7b8e;--shadow:0 16px 38px rgba(18,36,60,.15)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--navy) 0,var(--navy) 250px,var(--bg) 250px)}
    .wrap{width:min(1120px,calc(100% - 28px));margin:auto;padding:30px 0 48px}
    .brand{text-align:center;color:#fff;margin-bottom:22px}.brand h1{margin:0;font-size:18px;letter-spacing:.2em}.brand p{margin:7px 0 0;color:rgba(255,255,255,.78);font-size:13px;letter-spacing:.08em}
    .hero{max-width:760px;margin:0 auto 22px;padding:25px 22px;text-align:center;background:#fff;border-radius:24px;box-shadow:var(--shadow)}
    .hero h2{margin:0 0 7px;font-size:30px}.hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}.hero .meta{display:inline-flex;margin-top:14px;padding:8px 12px;border-radius:999px;background:#fff1e5;color:#9b4b00;font-size:13px;font-weight:800}
    .gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .card{overflow:hidden;background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
    .visual{position:relative;aspect-ratio:16/10;overflow:hidden;background:linear-gradient(135deg,#182d49,#0d1b2f)}
    .visual img{width:100%;height:100%;display:block;object-fit:cover}
    .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:rgba(255,255,255,.72);font-size:13px;text-align:center;padding:20px}.placeholder .icon{font-size:32px}
    .badge{position:absolute;top:12px;left:12px;padding:7px 10px;border-radius:999px;background:rgba(18,36,60,.88);color:#fff;font-size:11px;font-weight:900;letter-spacing:.07em}
    .body{padding:14px}.filename{margin:0 0 12px;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    button{width:100%;border:0;border-radius:14px;padding:13px 14px;background:var(--orange);color:#fff;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 7px 18px rgba(244,118,0,.24)}button:hover{filter:brightness(.97)}button:disabled{opacity:.55;cursor:progress}
    .all{margin-top:20px;background:var(--navy);box-shadow:0 10px 24px rgba(18,36,60,.2)}
    .status{min-height:24px;margin-top:14px;text-align:center;font-size:13px;color:var(--muted)}.status.ok{color:#237b46}.status.error{color:#b23620}
    .foot{text-align:center;margin:8px auto 0;max-width:650px;color:#8290a1;font-size:11px;line-height:1.45}
    .loading{max-width:760px;margin:0 auto;padding:28px 22px;text-align:center;background:#fff;border-radius:22px;box-shadow:var(--shadow);color:var(--muted);font-size:14px}
    @media(max-width:850px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:540px){.wrap{width:min(100% - 18px,1120px);padding-top:22px}.hero{padding:22px 16px}.hero h2{font-size:25px}.gallery{grid-template-columns:1fr;gap:13px}.visual{aspect-ratio:16/9}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand"><h1>DUNE MALTA</h1><p>DIVE CENTRE · MELLIEĦA</p></header>
    <section class="hero">
      <h2>Your dive memories 🤿</h2>
      <p id="subtitle">Your photos and videos are ready.</p>
      <div class="meta" id="heroMeta">Loading media…</div>
    </section>
    <div class="loading" id="loading">Preparing your gallery…</div>
    <section class="gallery" id="gallery" hidden></section>
    <button class="all" id="downloadAll" hidden>Download all originals</button>
    <div class="status" id="status"></div>
    <div class="foot">Original files are delivered directly from the GoPro cloud.</div>
  </main>
<script>
(() => {
  'use strict';

  const SHARE_ID='ac96f9a9-6741-432c-9ac8-cda5fab6935e';
  const API_ACCEPT='application/vnd.gopro.jk.media+json; version=2.0.0';
  const MEDIA_TYPES=new Set(['video','photo','burst','timelapse','timelapsevideo','burstvideo','multiclipedit']);

  const gallery=document.getElementById('gallery');
  const loading=document.getElementById('loading');
  const status=document.getElementById('status');
  const heroMeta=document.getElementById('heroMeta');
  const subtitle=document.getElementById('subtitle');
  const allButton=document.getElementById('downloadAll');

  let media=[];

  init();

  async function init(){
    try{
      const collection=await proxyJson(`https://api.gopro.com/media/items/${SHARE_ID}?page=1&per_page=100`);
      media=extractStrongMedia(collection);

      if(!media.length){
        media=await fallbackResolveMedia(collection);
      }

      if(!media.length)throw new Error('No media found in this GoPro share.');

      media.sort((a,b)=>String(a.capturedAt||'').localeCompare(String(b.capturedAt||'')));

      const title=cleanText(collection.title||'');
      if(title)subtitle.textContent=title;
      heroMeta.textContent=`${media.length} media`;

      renderGallery();
      loading.hidden=true;
      gallery.hidden=false;
      allButton.hidden=false;
      allButton.textContent=`Download all ${media.length} originals`;
      hydratePhotoPreviews();
    }catch(error){
      loading.textContent='Unable to prepare this gallery.';
      setStatus(friendlyError(error),'error');
    }
  }

  function renderGallery(){
    gallery.innerHTML='';
    media.forEach((m,index)=>{
      const isVideo=isVideoType(m.type);
      const card=document.createElement('article');
      card.className='card';
      card.innerHTML=`
        <div class="visual" id="visual-${index}">
          <div class="placeholder"><div class="icon">${isVideo?'🎬':'📷'}</div><div>${escapeHtml(m.filename||'Media')}</div></div>
          <span class="badge">${isVideo?'VIDEO':'PHOTO'}</span>
        </div>
        <div class="body">
          <p class="filename">${escapeHtml(m.filename||'Media')}</p>
          <button data-index="${index}">Download original</button>
        </div>`;
      gallery.appendChild(card);
    });
  }

  gallery.addEventListener('click',async event=>{
    const button=event.target.closest('button[data-index]');
    if(!button)return;
    const m=media[Number(button.dataset.index)];
    const old=button.textContent;
    button.disabled=true;
    button.textContent='Preparing…';
    setStatus(`Preparing ${m.filename||'media'}…`);
    try{
      const source=await resolveOriginal(m.id);
      triggerDirectDownload(source.url,m.filename||'media');
      setStatus(`${m.filename||'Media'} ready.`,'ok');
    }catch(error){
      setStatus(`Unable to prepare ${m.filename||'media'}: ${friendlyError(error)}`,'error');
    }finally{
      button.disabled=false;
      button.textContent=old;
    }
  });

  allButton.addEventListener('click',async()=>{
    allButton.disabled=true;
    setStatus(`Preparing ${media.length} original files…`);
    let opened=0;
    try{
      for(const m of media){
        const source=await resolveOriginal(m.id);
        triggerDirectDownload(source.url,m.filename||'media');
        opened+=1;
        await sleep(800);
      }
      setStatus(`${opened} downloads started.`,'ok');
    }catch(error){
      setStatus(`Download interrupted: ${friendlyError(error)}`,'error');
    }finally{
      allButton.disabled=false;
    }
  });

  async function hydratePhotoPreviews(){
    await Promise.all(media.map(async(m,index)=>{
      if(isVideoType(m.type))return;
      const visual=document.getElementById(`visual-${index}`);
      if(!visual)return;
      try{
        const resolved=await resolveDownload(m.id);
        const preview=pickPhotoPreview(resolved.variants);
        if(!preview||!preview.url)return;
        visual.innerHTML=`<img src="${escapeHtml(preview.url)}" alt="${escapeHtml(m.filename||'Photo')}"><span class="badge">PHOTO</span>`;
        const img=visual.querySelector('img');
        img.onerror=async()=>{
          try{
            const response=await fetch(`https://corsproxy.io/?url=${encodeURIComponent(preview.url)}`,{cache:'no-store'});
            if(!response.ok)throw new Error('preview unavailable');
            const blob=await response.blob();
            if(!blob.size)throw new Error('empty preview');
            const local=URL.createObjectURL(blob);
            visual.innerHTML=`<img src="${local}" alt="${escapeHtml(m.filename||'Photo')}"><span class="badge">PHOTO</span>`;
          }catch(_){ }
        };
      }catch(_){ }
    }));
  }

  function extractStrongMedia(root){
    const found=new Map();
    const seen=new WeakSet();

    function walk(value){
      if(!value||typeof value!=='object'||seen.has(value))return;
      seen.add(value);

      if(!Array.isArray(value)){
        const id=normalizeMediaId(value.id||value.media_id||value.medium_id);
        const type=String(value.type||'').trim();
        const filename=cleanText(value.filename||value.content_title||'');
        if(id&&MEDIA_TYPES.has(type.toLowerCase())&&filename){
          found.set(id,{
            id,
            type,
            filename,
            capturedAt:normalizeDate(value.captured_at||value.created_at)
          });
        }
      }

      Object.values(value).forEach(walk);
    }

    walk(root);
    return [...found.values()];
  }

  async function fallbackResolveMedia(root){
    const ids=collectObjectIds(root).slice(0,80);
    const results=[];
    for(const id of ids){
      try{
        const item=await proxyJson(`https://api.gopro.com/media/${id}`);
        const type=String(item.type||'').trim();
        const filename=cleanText(item.filename||item.content_title||'');
        if(normalizeMediaId(item.id)===id&&MEDIA_TYPES.has(type.toLowerCase())&&filename){
          results.push({id,type,filename,capturedAt:normalizeDate(item.captured_at||item.created_at)});
        }
      }catch(_){ }
    }
    const unique=new Map(results.map(item=>[item.id,item]));
    return [...unique.values()];
  }

  function collectObjectIds(root){
    const ids=new Set();
    const seen=new WeakSet();
    function walk(value){
      if(typeof value==='string'){
        const id=normalizeMediaId(value);
        if(id)ids.add(id);
        return;
      }
      if(!value||typeof value!=='object'||seen.has(value))return;
      seen.add(value);
      Object.values(value).forEach(walk);
    }
    walk(root);
    return [...ids];
  }

  async function resolveOriginal(id){
    const resolved=await resolveDownload(id);
    const variants=resolved.variants;
    const source=variants.find(v=>String(v.label||'').toLowerCase()==='source')
      ||variants.find(v=>String(v.label||'').toLowerCase()==='baked_source')
      ||variants.find(v=>String(v.label||'').toLowerCase()==='concat');
    if(!source||!source.url)throw new Error('original source unavailable');
    return source;
  }

  async function resolveDownload(id){
    const json=await proxyJson(`https://api.gopro.com/media/${encodeURIComponent(id)}/download`);
    const embedded=json&&json._embedded?json._embedded:{};
    const variants=[]
      .concat(Array.isArray(embedded.variations)?embedded.variations:[])
      .concat(Array.isArray(embedded.files)?embedded.files:[])
      .concat(Array.isArray(embedded.sidecar_files)?embedded.sidecar_files:[])
      .filter(v=>v&&v.url);
    return {json,variants};
  }

  function pickPhotoPreview(variants){
    const candidates=variants.filter(v=>{
      const type=String(v.type||'').toLowerCase();
      const url=String(v.url||'').toLowerCase();
      return /jpg|jpeg|png|webp/.test(type)||/\.(jpg|jpeg|png|webp)(\?|$)/.test(url);
    });
    if(!candidates.length)return null;
    candidates.sort((a,b)=>{
      const areaA=(Number(a.width)||99999)*(Number(a.height)||99999)+(/source/i.test(String(a.label||''))?1e15:0);
      const areaB=(Number(b.width)||99999)*(Number(b.height)||99999)+(/source/i.test(String(b.label||''))?1e15:0);
      return areaA-areaB;
    });
    return candidates[0];
  }

  async function proxyJson(target){
    let json=null,lastError=null;
    try{
      const response=await fetch(`https://corsproxy.io/?url=${encodeURIComponent(target)}`,{method:'GET',cache:'no-store',headers:{Accept:API_ACCEPT}});
      if(!response.ok)throw new Error(`proxy HTTP ${response.status}`);
      json=await response.json();
    }catch(error){lastError=error;}

    if(!json){
      try{
        const response=await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`,{cache:'no-store'});
        if(!response.ok)throw new Error(`fallback HTTP ${response.status}`);
        json=await response.json();
      }catch(error){lastError=error;}
    }

    if(!json)throw new Error(lastError?lastError.message:'media service unavailable');
    return json;
  }

  function normalizeMediaId(value){const id=String(value||'').trim().toLowerCase();return /^[0-9a-f]{24}$/.test(id)?id:'';}
  function normalizeDate(value){const d=new Date(value||'');return Number.isNaN(d.getTime())?'':d.toISOString();}
  function isVideoType(type){return /video|multiclip/i.test(String(type||''));}
  function cleanText(value){return String(value||'').replace(/[\r\n\t]+/g,' ').trim().slice(0,180);}
  function triggerDirectDownload(url,filename){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.download=filename;document.body.appendChild(a);a.click();a.remove();}
  function setStatus(message,cls=''){status.textContent=message;status.className=`status ${cls}`.trim();}
  function friendlyError(error){return String(error&&error.message||error||'unknown error');}
  function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
  function escapeHtml(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
})();
</script>
</body>
</html>
