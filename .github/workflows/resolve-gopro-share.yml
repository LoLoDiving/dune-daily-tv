name: Resolve GoPro share

on:
  push:
    branches: [main]
    paths:
      - 'gopro-requests/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve GoPro shares
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          API_BASE = 'https://api.gopro.com'
          ACCEPT = 'application/vnd.gopro.jk.media+json; version=2.0.0'
          MEDIA_TYPES = {
              'video', 'photo', 'burst', 'timelapse',
              'timelapsevideo', 'burstvideo', 'multiclipedit'
          }
          ID_RE = re.compile(r'^[0-9a-f]{24}$', re.I)

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      'Accept': ACCEPT,
                      'User-Agent': 'Mozilla/5.0 DUNE-Malta-Media-Resolver/1.0'
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode('utf-8'))

          def clean_text(value, limit=180):
              return re.sub(r'[\r\n\t]+', ' ', str(value or '')).strip()[:limit]

          def normalize_date(value):
              return str(value or '').strip()

          def strong_media(root):
              found = {}
              seen = set()

              def walk(value):
                  if isinstance(value, dict):
                      oid = id(value)
                      if oid in seen:
                          return
                      seen.add(oid)
                      media_id = str(value.get('id') or value.get('media_id') or value.get('medium_id') or '').lower()
                      media_type = str(value.get('type') or '').strip()
                      filename = clean_text(value.get('filename') or value.get('content_title') or '')
                      if ID_RE.match(media_id) and media_type.lower() in MEDIA_TYPES and filename:
                          found[media_id] = {
                              'id': media_id,
                              'type': media_type,
                              'filename': filename,
                              'capturedAt': normalize_date(value.get('captured_at') or value.get('created_at')),
                              'width': int(value.get('width') or 0),
                              'height': int(value.get('height') or 0),
                          }
                      for child in value.values():
                          walk(child)
                  elif isinstance(value, list):
                      for child in value:
                          walk(child)

              walk(root)
              return found

          def collect_ids(root):
              ids = set()
              def walk(value):
                  if isinstance(value, str):
                      text = value.strip().lower()
                      if ID_RE.match(text):
                          ids.add(text)
                  elif isinstance(value, dict):
                      for child in value.values():
                          walk(child)
                  elif isinstance(value, list):
                      for child in value:
                          walk(child)
              walk(root)
              return sorted(ids)

          def fetch_canonical(media_id):
              try:
                  item = get_json(f'{API_BASE}/media/{media_id}')
                  item_id = str(item.get('id') or '').lower()
                  media_type = str(item.get('type') or '').strip()
                  filename = clean_text(item.get('filename') or item.get('content_title') or '')
                  if item_id == media_id and media_type.lower() in MEDIA_TYPES and filename:
                      return {
                          'id': media_id,
                          'type': media_type,
                          'filename': filename,
                          'capturedAt': normalize_date(item.get('captured_at') or item.get('created_at')),
                          'width': int(item.get('width') or 0),
                          'height': int(item.get('height') or 0),
                      }
              except Exception:
                  pass
              return None

          requests_dir = Path('gopro-requests')
          output_dir = Path('gopro-data')
          output_dir.mkdir(parents=True, exist_ok=True)

          for request_path in sorted(requests_dir.glob('*.json')):
              request = json.loads(request_path.read_text(encoding='utf-8'))
              share_id = str(request['share_id']).strip().lower()
              output_name = str(request.get('output') or f'{share_id}.json').strip()

              collection = None
              last_error = None
              for endpoint in (
                  f'{API_BASE}/media/items/{share_id}?page=1&per_page=100',
                  f'{API_BASE}/media/items/{share_id}',
              ):
                  try:
                      collection = get_json(endpoint)
                      break
                  except Exception as exc:
                      last_error = exc

              if collection is None:
                  raise RuntimeError(f'Unable to resolve {share_id}: {last_error}')

              media = strong_media(collection)

              object_ids = [mid for mid in collect_ids(collection) if mid not in media]
              if object_ids:
                  with ThreadPoolExecutor(max_workers=8) as pool:
                      futures = {pool.submit(fetch_canonical, mid): mid for mid in object_ids[:120]}
                      for future in as_completed(futures):
                          item = future.result()
                          if item:
                              media[item['id']] = item

              items = list(media.values())
              items.sort(key=lambda x: (x.get('capturedAt') or '', x.get('filename') or ''))

              result = {
                  'schemaVersion': 1,
                  'shareId': share_id,
                  'title': clean_text(collection.get('title') or ''),
                  'label': clean_text(collection.get('label') or ''),
                  'mediaCount': len(items),
                  'media': items,
              }

              output_path = output_dir / output_name
              output_path.write_text(
                  json.dumps(result, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8'
              )
              print(f'Resolved {share_id}: {len(items)} media -> {output_path}')
          PY

      - name: Commit resolved media data
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- gopro-data)" ]; then
            echo "No media data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gopro-data
          git commit -m "Resolve GoPro share media data"
          git push
